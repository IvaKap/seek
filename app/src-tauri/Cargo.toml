[package]
name = "seek"
version = "0.2.2"
description = "Seek — an Apple-native frontend for Nicotine+"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-or-later"

# The binary is a thin wrapper around the library, which is the Tauri v2 layout:
# it keeps the same entry point reachable from a mobile target later.
[lib]
name = "seek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.0.0-rc.5"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
