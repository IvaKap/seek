# Seek — feature request form.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Deliberately short. The best requests this project has had described a
# digging habit that was awkward, not a control that was missing.

name: Feature request
description: Something Seek could do that it does not
labels: ["enhancement"]

body:
  - type: textarea
    id: want
    attributes:
      label: What would you like Seek to do?
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: >
        Including "I don't, I just give up". Knowing the workaround is usually
        what shows which part actually matters.
    validations:
      required: false
