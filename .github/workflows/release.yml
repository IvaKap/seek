# Seek — build a macOS app and attach it to a GitHub Release.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Runs on a tag, not on every push: the Rust compile plus the PyInstaller freeze
# is minutes of macOS runner time.
#
# WHAT THIS DOES NOT DO IS NOTARISE. Without an Apple Developer ID the bundle is
# ad-hoc signed — valid, but not trusted — so a recipient still has to allow it
# once. See "Signing" at the foot of this file for exactly what to add when a
# certificate exists; nothing else has to change.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload the asset

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: |
          cd app && npm ci
          cd ../sidecar
          python -m venv .venv
          # Needs the dev set: release.sh runs the tests and then freezes.
          .venv/bin/pip install --quiet -r requirements-dev.txt

      # release.sh is the whole pipeline, and it is the same script used by hand:
      # it runs both test suites, freezes the engine, REFUSES to continue if the
      # freeze is stale or the four version declarations disagree, builds, and
      # fails if the bundle's signature does not verify.
      # macOS keys a Downloads/Desktop/Documents permission grant to the app's
      # CODE IDENTITY. Ad-hoc signing (`signingIdentity: "-"`) has no
      # certificate to anchor that to, so the only identity is the content hash
      # — which changes on every build, so every update asks for the folder
      # again. A stable certificate, reused forever, is what makes successive
      # builds look like the same app.
      #
      # Conditional ON PURPOSE. With no secret configured nothing is exported
      # and the build is ad-hoc exactly as before, so this is safe to merge
      # before the certificate exists.
      #
      # WE DO THE KEYCHAIN WORK, AND DELIBERATELY DO NOT EXPORT APPLE_CERTIFICATE.
      # Tauri has two paths (tauri-bundler/src/bundle/macos/sign.rs::keychain):
      # given APPLE_CERTIFICATE it imports the .p12 and then ENUMERATES the
      # keychain for a valid identity — and a self-signed certificate is not a
      # valid one until it is trusted, so `security find-identity -v` returns
      # nothing and the build dies with "failed to resolve signing identity".
      # That is exactly how v0.2.7 failed the first time.
      #
      # Given only APPLE_SIGNING_IDENTITY it skips the enumeration and hands the
      # name straight to `codesign -s`, which signs perfectly well with an
      # untrusted certificate — measured, not assumed. So we import it here and
      # pass only the name.
      #
      # The SEARCH LIST is the part that is easy to miss: `Keychain::sign` only
      # passes `--keychain` when it created the keychain itself, so with this
      # path codesign resolves the private key through the user's search list.
      # Leave the new keychain out of it and codesign blocks on a GUI prompt
      # that no runner will ever answer.
      - name: Use a signing certificate, if one is configured
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$CERT" ] || [ -z "$IDENTITY" ]; then
            echo "no certificate configured — ad-hoc signing, as before"
            exit 0
          fi

          KC="$RUNNER_TEMP/seek-signing.keychain-db"
          KCPASS="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/seek-signing.p12"
          # -A: the secret is one unwrapped line, which is how the runbook makes it.
          printf '%s' "$CERT" | openssl base64 -d -A > "$P12"

          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -t 3600 -u "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$P12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          # Keep whatever was already there; add ours.
          EXISTING="$(security list-keychain -d user | tr -d ' "')"
          # shellcheck disable=SC2086
          security list-keychain -d user -s $EXISTING "$KC"
          rm -f "$P12"

          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "imported the certificate; signing as \"$IDENTITY\""

      - name: Build
        # The updater artifacts are signed during the BUNDLE step, so the key
        # has to be in the environment here rather than at packaging time.
        # Without it the build still succeeds and simply emits no .sig, which
        # every client then rejects — so the manifest step fails loudly on an
        # empty signature rather than shipping a release nobody can install.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./release.sh

      # A build that was MEANT to be signed and came out ad-hoc is the failure
      # mode this whole exercise exists to prevent, and it is invisible in a
      # green log. So assert it rather than hope.
      - name: The bundle is signed with the configured identity
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          APP=app/src-tauri/target/release/bundle/macos/Seek.app
          codesign -dvvv "$APP" 2>&1 | grep -E "Signature|Authority|TeamIdentifier" || true
          if codesign -dvvv "$APP" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::APPLE_SIGNING_IDENTITY was set but the bundle is ad-hoc signed"
            exit 1
          fi
          codesign -dvvv "$APP" 2>&1 | grep -q "Authority=$APPLE_SIGNING_IDENTITY" || {
            echo "::error::bundle is not signed by \"$APPLE_SIGNING_IDENTITY\""
            exit 1
          }
          echo "signed by $APPLE_SIGNING_IDENTITY"

      - name: Package
        id: package
        run: |
          VERSION="$(node -p "require('./app/package.json').version")"
          STAGE="$(mktemp -d)/Seek-${VERSION}"
          mkdir -p "$STAGE"
          cp -R app/src-tauri/target/release/bundle/macos/Seek.app "$STAGE/"
          cp .github/RELEASE_README.txt "$STAGE/READ ME FIRST.txt"
          # ditto, not zip: it preserves the bundle's symlinks and signature.
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "Seek-${VERSION}-macOS.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip=Seek-${VERSION}-macOS.zip" >> "$GITHUB_OUTPUT"

          # --- what the in-app updater downloads --------------------------
          BUNDLE_DIR="app/src-tauri/target/release/bundle/macos"
          TARBALL="$(find "$BUNDLE_DIR" -name '*.app.tar.gz' | head -1)"
          SIGFILE="$(find "$BUNDLE_DIR" -name '*.app.tar.gz.sig' | head -1)"
          [ -n "$TARBALL" ] || { echo "::error::no .app.tar.gz — is bundle.createUpdaterArtifacts true?"; exit 1; }
          [ -n "$SIGFILE" ] || { echo "::error::no .sig — is TAURI_SIGNING_PRIVATE_KEY set as a repo secret?"; exit 1; }

          # A fixed asset name. The manifest carries a versioned download URL,
          # but the MANIFEST url is hard-coded in the app and resolved through
          # /releases/latest/download/, which needs a filename that never moves.
          cp "$TARBALL" "Seek.app.tar.gz"

          python3 .github/updater-manifest.py \
            --version "$VERSION" \
            --signature-file "$SIGFILE" \
            --repo "${{ github.repository }}" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out latest.json

      # Prove the artifact survived zipping before anyone downloads it. A
      # signature that verifies here is the difference between "unidentified
      # developer" (which the user can allow) and "is damaged" (which they
      # cannot).
      - name: Verify the packaged app
        run: |
          V="$(mktemp -d)"
          ditto -x -k "${{ steps.package.outputs.zip }}" "$V"
          APP="$(find "$V" -name 'Seek.app' -maxdepth 3 | head -1)"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -q 'linker-signed' \
            && { echo "::error::bundle is linker-signed; Gatekeeper will call it damaged"; exit 1; } || true
          echo "signature verifies"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            Seek.app.tar.gz
            latest.json
          draft: true          # review it, then publish
          generate_release_notes: true
          body: |
            ## Installing

            macOS quarantines apps that are not signed with a paid Apple
            Developer certificate. Seek is not. After moving it to
            Applications, run this once:

            ```
            xattr -dr com.apple.quarantine /Applications/Seek.app
            ```

            It prints nothing when it works, and Seek opens normally from then
            on. You may instead be offered **System Settings → Privacy &
            Security → Open Anyway**, which does the same thing.

            Building from source avoids this entirely — an app you compile
            yourself is never quarantined.

# ---------------------------------------------------------------- Signing
#
# To ship something that opens with no warning at all, you need an Apple
# Developer ID ($99/year). Then, in this job:
#
#   1. Import the certificate into a temporary keychain (see
#      apple-actions/import-codesign-certs).
#   2. Set bundle.macOS.signingIdentity in app/src-tauri/tauri.conf.json to the
#      identity name instead of "-", or override it with
#      TAURI_SIGNING_IDENTITY.
#   3. After the build:
#        xcrun notarytool submit "$ZIP" --apple-id … --team-id … \
#          --password "$APP_SPECIFIC_PASSWORD" --wait
#        xcrun stapler staple Seek.app     # then re-zip, so the ticket ships
#
# Nothing else in this file changes, and the verify step above keeps working.
